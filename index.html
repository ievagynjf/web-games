<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的游戏大厅</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchGame('sudoku', this)">数独</button>
        <button class="tab-btn" onclick="switchGame('minesweeper', this)">扫雷</button>
        <button class="tab-btn" onclick="switchGame('tetris', this)">俄罗斯方块</button>
        <button class="tab-btn" onclick="switchGame('breakout', this)">打砖块</button>
    </div>
    <iframe class="game-frame active" data-game="sudoku" src="Sudoku/index.html"></iframe>
    <iframe class="game-frame" data-game="minesweeper" src="Minesweeper/index.html"></iframe>
    <iframe class="game-frame" data-game="tetris" src="Tetris/index.html"></iframe>
    <iframe class="game-frame" data-game="breakout" src="Breakout/index.html"></iframe>
    <script>
        function switchGame(game, element) {
            document.querySelectorAll('.game-frame').forEach(frame => {
                frame.classList.toggle('active', frame.dataset.game === game);
            });
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
